[project]
name = "almlight"
version = "0.6.0"
description = "Lightweight engineering backbone (ALM/PLM)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM"]
ignore = ["B008", "SIM108", "UP040", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
